<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geo Location Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
     integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
     integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM="
     crossorigin=""></script>
   <style>
     #mymap { height: 480px; }
   </style>
  </head>
  <body>
    <div class="container py-3" style="view-transition-name: transitiondemo">
      <div class="d-flex flex-column flex-md-row align-items-center pb-3 mb-4 border-bottom">
        <a href="index.html" class="d-flex align-items-center text-dark text-decoration-none">
          <span class="fs-4">Web API's Demos</span>
        </a>
      </div>
      <h1 class="page-header">Geolocation Demo</h1>
      <p>This <a href="https://developer.mozilla.org/en-US/docs/Web/API/Geolocation/Using_geolocation">example</a> (slightly modified) provided by <a href="https://developer.mozilla.org/">Mozilla Developer Network</a> and demonstrates how to use the Geolocation API to get a user's location (with their permission).</p>

      <p><button onclick="geoFindMe()" class="btn btn-primary"><i class="bi bi-geo-alt-fill"></i> Show my location</button></p>

      <div class="card card-default">
        <div class="card-header">
          <h3 class="card-title"><i class="bi bi-pin-map-fill"></i> My Location</h3>
        </div>
        <div class="card-body">
          <div id="mylocation"></div>
          <div id="mymap"></div>
        </div>
      </div>

      <div class="my-5"><a href="index.html" class="btn btn-primary"><i class="bi bi-chevron-left"></i> Back Home</a></div>

      <script type="text/javascript">
      function geoFindMe() {
        var output = document.getElementById("mylocation");

        if (!navigator.geolocation){
          output.innerHTML = "<p>Geolocation is not supported by your browser</p>";
          return;
        }

        function success(position) {
          var latitude  = position.coords.latitude;
          var longitude = position.coords.longitude;

          output.innerHTML = '<p>Latitude is ' + latitude + '&deg; <br>Longitude is ' + longitude + '&deg;</p>';
          var mymap = L.map('mymap').setView([latitude, longitude], 18);

          L.tileLayer('http://tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Imagery © <a href="https://www.mapbox.com/">Mapbox</a>',
              maxZoom: 24,
              minZoom:  13
          }).addTo(mymap);

          var marker = L.marker([latitude, longitude]).addTo(mymap);

          // var img = new Image();
          // img.src = "https://maps.googleapis.com/maps/api/staticmap?center=" + latitude + "," + longitude + "&zoom=15&size=480x480&markers=color:red|" + latitude + "," + longitude + "&key=<apikey>";
          // img.className = 'img img-thumbnail';

          // output.appendChild(img);
        }

        function error() {
          output.innerHTML = "Unable to retrieve your location";
        }

        output.innerHTML = "<p>Locating…</p>";

        navigator.geolocation.getCurrentPosition(success, error);
      }
      </script>
    </div>
  </body>
</html>
